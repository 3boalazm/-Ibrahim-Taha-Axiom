<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg { fill: #f6f4ee; } .ink { fill: #1d4e6e; } .rule { stroke: #1d4e6e; }
    @media (prefers-color-scheme: dark) { .bg { fill: #111316; } .ink { fill: #93bfdc; } .rule { stroke: #93bfdc; } }
  </style>
  <rect class="bg" width="64" height="64" rx="12"/>
  <text class="ink" x="32" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">IT</text>
  <line class="rule" x1="16" y1="50" x2="48" y2="50" stroke-width="2.5" stroke-linecap="round"/>
</svg>
